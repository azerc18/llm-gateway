server:
  port: 8080

spring:
  application:
    name: llm-gateway
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active:
      - ${DEFAULT_PROFILE:local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true