server:
  port: 8080

spring:
  application:
    name: llm-gateway
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active:
      - ${DEFAULT_PROFILE:local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:file:.env[.properties]
logging:
  pattern:
    level: "%5p [%X{requestId}]"

llm:
  providers:
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      timeout: 15s
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      timeout: 15s
  gemini:
    thinking-level: minimal
  routes:
    chat-fast:
      primary:
        provider: groq
        model: openai/gpt-oss-120b
      fallback:
        provider: gemini
        model: gemini-3.6-flash
    chat-gemini:
      primary:
        provider: gemini
        model: gemini-3.6-flash
      fallback:
        provider: groq
        model: openai/gpt-oss-120b
  retry:
    max-attempts: 2
    fallback-max-attempts: 1
    initial-backoff: 1s
    multiplier: 2.0
    max-backoff: 4s
    deadline: 50s
