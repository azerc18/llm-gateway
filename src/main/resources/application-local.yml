spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:llm_db}
    username: ${DB_USERNAME:llm_user}
    password: ${DB_PASSWORD:llm_password}
  flyway:
    locations: classpath:db/migration, classpath:db/seed

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
