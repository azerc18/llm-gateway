services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-llm_db}
      POSTGRES_USER: ${DB_USERNAME:-llm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llm_password}
    ports:
      - "5432:5432"
    volumes:
      - llm_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  llm_postgres: